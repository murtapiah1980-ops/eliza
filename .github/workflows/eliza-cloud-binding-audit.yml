name: Eliza Cloud binding audit
on:
  push:
    branches: [codex/eliza-cloud-binding-audit]
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify the deployment token can read both canonical routes
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4"
          cf() { curl --fail --silent --show-error --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint/$1"; }
          zone=$(cf "zones?name=eliza.app&account.id=$CLOUDFLARE_ACCOUNT_ID" | jq -er --arg expected "$CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.name=="eliza.app" and .account.id==$expected) | .id')
          routes=$(cf "zones/$zone/workers/routes")
          jq -e '.success and any(.result[]; .pattern=="api-staging.eliza.app/*" and .script=="eliza-cloud-api-staging") and any(.result[]; .pattern=="api.eliza.app/*" and .script=="eliza-cloud-api-prod")' <<< "$routes"
